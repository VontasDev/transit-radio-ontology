[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "transit-radio-ontology"
version = "0.1.0"
description = "Shared vocabulary for transit radio: entities, events, and relationships grounded in Vontas Resolve customer findings."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
authors = [{ name = "Vontas / Orion Savant" }]
keywords = ["transit", "radio", "ontology", "gtfs", "transmodel", "orion"]
classifiers = [
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
dependencies = [
    "pydantic>=2.6",
    "jsonschema>=4.21",
    "referencing>=0.35",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
transit-radio-ontology = "transit_radio_ontology.cli:app"

[project.urls]
Homepage = "https://github.com/VontasDev/transit-radio-ontology"
Source = "https://github.com/VontasDev/transit-radio-ontology"

[tool.hatch.build.targets.wheel]
packages = ["src/transit_radio_ontology"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "transit_radio_ontology/_schemas"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/schemas",
    "/examples",
    "/docs",
    "/tests",
    "/README.md",
    "/LICENSE",
    "/CONTRIBUTING.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

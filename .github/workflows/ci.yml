name: ci

on:
  push:
  pull_request:

jobs:
  json-lint:
    name: json-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every schema + example as JSON
        run: |
          set -euo pipefail
          fail=0
          for f in $(find schemas examples -type f -name '*.json'); do
            if ! python -m json.tool "$f" > /dev/null; then
              echo "::error file=$f::invalid JSON"
              fail=1
            fi
          done
          exit $fail

  test:
    name: tests (py${{ matrix.python-version }})
    needs: json-lint
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run pytest
        run: pytest -q --cov=transit_radio_ontology
